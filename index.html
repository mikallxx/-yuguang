<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>示範旅宿 The Sample Stay｜一頁式旅宿網站模板</title>
<meta name="description" content="這是一個可重複套用的一頁式旅宿網站模板，所有文字與圖片皆為示意內容，實際使用前請替換 CONTENT 資料檔。">
<meta property="og:title" content="示範旅宿 The Sample Stay">
<meta property="og:description" content="一頁式旅宿網站模板 — 版型示範，非真實旅宿資訊。">
<meta property="og:type" content="website">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@300;400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     DESIGN TOKENS
     ============================================================ */
  :root{
    --cream:#F6F1E4;
    --ink:#15130F;
    --ink-dim:rgba(21,19,15,0.62);
    --ink-faint:rgba(21,19,15,0.15);
    --yellow:#F4D000;
    --yellow-ink:#15130F;
    --line:rgba(21,19,15,0.15);
    --radius:2px;
    --container:1180px;
    --gutter:6vw;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.01ms !important;transition-duration:0.01ms !important;scroll-behavior:auto !important;}
  }
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Noto Sans TC',sans-serif;
    font-weight:300;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  ul{list-style:none;}
  img{max-width:100%;display:block;}
  .wrap{max-width:var(--container);margin:0 auto;padding:0 var(--gutter);}
  .eyebrow{
    font-family:'Space Grotesk',sans-serif;
    font-size:12px;letter-spacing:3px;text-transform:uppercase;
    color:var(--ink-dim);margin-bottom:14px;display:flex;align-items:center;gap:10px;
  }
  .eyebrow::before{content:'';width:22px;height:1px;background:var(--ink);display:inline-block;}
  h1,h2,h3{font-family:'Noto Serif TC',serif;font-weight:900;color:var(--ink);letter-spacing:0.5px;}
  .btn{
    display:inline-flex;align-items:center;gap:10px;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;letter-spacing:1px;
    padding:16px 30px;border-radius:var(--radius);
    background:var(--ink);color:var(--cream);
    transition:background 0.25s ease, color 0.25s ease, transform 0.25s ease;
    border:1px solid var(--ink);
  }
  .btn:hover,.btn:focus-visible{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow);outline:none;}
  .btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
  .btn.ghost{background:transparent;color:var(--ink);}
  .btn.ghost:hover,.btn.ghost:focus-visible{background:var(--ink);color:var(--cream);}
  .btn.on-dark{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow);}
  .btn.on-dark:hover,.btn.on-dark:focus-visible{background:var(--cream);color:var(--ink);border-color:var(--cream);}

  section{padding:96px 0;border-bottom:1px solid var(--line);}
  .section-head{display:flex;flex-direction:column;gap:6px;margin-bottom:52px;max-width:640px;}
  .section-title{font-size:clamp(28px,4.4vw,46px);line-height:1.25;}

  /* reveal-on-scroll */
  .reveal{opacity:0;transform:translateY(22px);transition:opacity 0.7s ease, transform 0.7s ease;}
  .reveal.in-view{opacity:1;transform:translateY(0);}
  @media (prefers-reduced-motion: reduce){
    .reveal{opacity:1;transform:none;}
  }

  /* ============================================================
     PLACEHOLDER IMAGE SYSTEM — centralized, single class,
     swap for a real <img> later by editing render logic only.
     ============================================================ */
  .ph{
    position:relative;overflow:hidden;
    background:
      repeating-linear-gradient(135deg, rgba(21,19,15,0.05) 0 1px, transparent 1px 18px),
      var(--cream-ph, #EDE5D2);
    border:1px solid var(--ink-faint);
    display:flex;align-items:flex-end;
  }
  .ph::before{
    content:'';position:absolute;inset:0;
    background:
      linear-gradient(120deg, rgba(244,208,0,0.16), transparent 55%),
      linear-gradient(300deg, rgba(21,19,15,0.06), transparent 60%);
  }
  .ph-tag{
    position:relative;z-index:1;
    font-family:'Space Grotesk',sans-serif;
    font-size:11px;letter-spacing:1.5px;
    color:var(--ink-dim);
    background:rgba(246,241,228,0.85);
    border:1px solid var(--ink-faint);
    padding:6px 11px;margin:14px;border-radius:20px;
  }

  /* ============================================================
     NAV
     ============================================================ */
  .iab-banner{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--yellow);color:var(--ink);
    padding:12px 6vw;font-size:13px;line-height:1.5;
  }
  .iab-banner span{flex:1;}
  .iab-close{
    background:none;border:none;color:var(--ink);font-size:20px;line-height:1;
    cursor:pointer;padding:0 4px;flex-shrink:0;
  }
  .iab-close:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}

  header.site-nav{
    position:sticky;top:0;z-index:60;
    background:rgba(246,241,228,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .nav-row{display:flex;align-items:center;justify-content:space-between;padding:16px var(--gutter);}
  .nav-logo{font-family:'Noto Serif TC',serif;font-weight:900;font-size:18px;letter-spacing:1px;}
  .nav-links{display:none;gap:28px;font-size:13px;letter-spacing:1px;}
  .nav-links a{padding:4px 0;border-bottom:1px solid transparent;}
  .nav-links a:hover,.nav-links a:focus-visible{border-bottom-color:var(--ink);}
  .nav-cta{display:none;}
  .nav-toggle{
    background:none;border:1px solid var(--ink);border-radius:var(--radius);
    width:40px;height:36px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .nav-toggle span,.nav-toggle span::before,.nav-toggle span::after{
    content:'';display:block;width:18px;height:2px;background:var(--ink);position:relative;transition:transform 0.25s ease, opacity 0.25s ease;
  }
  .nav-toggle span::before{position:absolute;top:-6px;}
  .nav-toggle span::after{position:absolute;top:6px;}
  .nav-toggle[aria-expanded="true"] span{background:transparent;}
  .nav-toggle[aria-expanded="true"] span::before{transform:translateY(6px) rotate(45deg);}
  .nav-toggle[aria-expanded="true"] span::after{transform:translateY(-6px) rotate(-45deg);}
  .nav-mobile{display:none;flex-direction:column;padding:8px var(--gutter) 24px;border-top:1px solid var(--line);}
  .nav-mobile.open{display:flex;}
  .nav-mobile a{padding:12px 0;font-size:15px;border-bottom:1px solid var(--line);}
  .nav-mobile .btn{margin-top:16px;justify-content:center;}
  @media(min-width:860px){
    .nav-links{display:flex;}
    .nav-cta{display:inline-flex;}
    .nav-toggle{display:none;}
  }

  /* ============================================================
     HERO
     ============================================================ */
  .hero{padding:64px 0 0;border-bottom:none;}
  .hero-copy{padding:0 var(--gutter);margin-bottom:36px;}
  .hero-title{
    font-size:clamp(44px,11vw,120px);
    line-height:0.98;letter-spacing:0.5px;
    max-width:16ch;
  }
  .hero-title mark{background:none;color:var(--ink);position:relative;display:inline-block;}
  .hero-title mark::after{
    content:'';position:absolute;left:-2%;right:-2%;bottom:0.06em;height:0.28em;
    background:var(--yellow);z-index:-1;
  }
  .hero-sub{margin-top:24px;font-size:16px;color:var(--ink-dim);max-width:46ch;}
  .hero-actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:32px;}
  .hero-media{position:relative;}
  .hero-media .ph{width:100%;height:52vh;min-height:340px;border-left:none;border-right:none;}
  .scroll-hint{
    position:absolute;right:var(--gutter);bottom:18px;z-index:2;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    font-family:'Space Grotesk',sans-serif;font-size:11px;letter-spacing:2px;color:var(--ink);
  }
  .scroll-hint .line{width:1px;height:34px;background:var(--ink);animation:scrollpulse 1.8s ease-in-out infinite;}
  @keyframes scrollpulse{0%,100%{transform:scaleY(1);opacity:0.4;}50%{transform:scaleY(0.5);opacity:1;}}

  /* ============================================================
     INTRO
     ============================================================ */
  .intro-grid{display:grid;grid-template-columns:1fr;gap:36px;align-items:start;}
  .intro-media .ph{aspect-ratio:4/5;}
  .intro-text p{color:var(--ink-dim);font-size:15.5px;margin-bottom:16px;max-width:52ch;}
  @media(min-width:820px){
    .intro-grid{grid-template-columns:0.9fr 1.1fr;gap:64px;}
  }

  /* ============================================================
     FEATURES (3 highlights)
     ============================================================ */
  .feature-list{display:grid;grid-template-columns:1fr;gap:0;border-top:1px solid var(--line);}
  .feature-item{
    display:grid;grid-template-columns:auto 1fr;gap:20px;
    padding:32px 0;border-bottom:1px solid var(--line);
  }
  .feature-index{font-family:'Space Grotesk',sans-serif;font-size:13px;color:var(--ink-dim);padding-top:6px;}
  .feature-item h3{font-size:20px;margin-bottom:8px;}
  .feature-item p{color:var(--ink-dim);font-size:14.5px;max-width:52ch;}
  @media(min-width:760px){
    .feature-list{grid-template-columns:repeat(3,1fr);border-top:none;}
    .feature-item{grid-template-columns:1fr;border-bottom:none;border-top:2px solid var(--ink);padding:24px 22px 0 0;}
  }

  /* ============================================================
     ROOMS
     ============================================================ */
  .room-list{display:flex;flex-direction:column;gap:64px;}
  .room-item{display:grid;grid-template-columns:1fr;gap:28px;}
  .room-media .ph{aspect-ratio:5/4;}
  .room-body{display:flex;flex-direction:column;gap:14px;}
  .room-name{font-size:clamp(24px,3vw,32px);}
  .room-desc{color:var(--ink-dim);font-size:14.5px;max-width:48ch;}
  .room-meta{display:flex;flex-wrap:wrap;gap:10px;}
  .room-tag{font-family:'Space Grotesk',sans-serif;font-size:11px;letter-spacing:1px;border:1px solid var(--ink);padding:5px 12px;border-radius:20px;}
  .room-price{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin-top:4px;}
  .room-price small{font-size:12px;font-weight:400;color:var(--ink-dim);letter-spacing:0.5px;}
  @media(min-width:820px){
    .room-item{grid-template-columns:1.1fr 0.9fr;align-items:center;gap:56px;}
    .room-item:nth-child(even){direction:rtl;}
    .room-item:nth-child(even) > *{direction:ltr;}
  }

  /* ============================================================
     GALLERY
     ============================================================ */
  .gallery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .gallery-grid .ph{aspect-ratio:1/1;}
  .gallery-grid .ph:nth-child(3n+1){aspect-ratio:1/1.3;}
  @media(min-width:700px){
    .gallery-grid{grid-template-columns:repeat(4,1fr);}
    .gallery-grid .ph:nth-child(4n+1){grid-row:span 2;aspect-ratio:auto;}
  }

  /* ============================================================
     STAY INFO
     ============================================================ */
  .info-list{display:grid;grid-template-columns:1fr;gap:0;}
  @media(min-width:700px){.info-list{grid-template-columns:1fr 1fr;column-gap:48px;}}
  .info-row{display:flex;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);font-size:14.5px;}
  .info-row .k{color:var(--ink-dim);letter-spacing:0.5px;white-space:nowrap;}
  .info-row .v{font-weight:500;text-align:right;}
  .info-note{margin-top:24px;font-size:12.5px;color:var(--ink-dim);max-width:60ch;line-height:1.8;}

  /* ============================================================
     LOCATION
     ============================================================ */
  .location-grid{display:grid;grid-template-columns:1fr;gap:32px;}
  .location-card{
    aspect-ratio:16/11;background:var(--ink);color:var(--cream);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    gap:16px;padding:32px;border-radius:var(--radius);position:relative;overflow:hidden;
    text-decoration:none;cursor:pointer;
  }
  .radar{position:relative;width:64px;height:64px;display:flex;align-items:center;justify-content:center;}
  .radar-ring{
    position:absolute;border:1px solid rgba(244,208,0,0.35);border-radius:50%;
    animation:radar-pulse 2.6s ease-out infinite;
  }
  .radar-ring.r1{width:64px;height:64px;animation-delay:0s;}
  .radar-ring.r2{width:64px;height:64px;animation-delay:1.3s;}
  @keyframes radar-pulse{
    0%{transform:scale(0.3);opacity:0;}
    30%{opacity:1;}
    100%{transform:scale(1.6);opacity:0;}
  }
  .radar svg{position:relative;z-index:1;width:30px;height:30px;}
  .location-card-title{font-family:'Noto Serif TC',serif;font-weight:900;font-size:24px;letter-spacing:1px;}
  .location-card-sub{font-family:'Space Grotesk',sans-serif;font-size:11px;letter-spacing:3px;color:rgba(246,241,228,0.55);text-transform:uppercase;}
  .location-card .btn{margin-top:4px;}
  .location-card .btn.on-dark:hover,.location-card .btn.on-dark:focus-visible{background:var(--cream);color:var(--ink);}

  /* ripple click effect */
  .ripple-btn{position:relative;overflow:hidden;}
  .ripple{
    position:absolute;border-radius:50%;background:rgba(255,138,0,0.4);
    transform:scale(0);pointer-events:none;animation:ripple-out 0.6s ease-out;
  }
  @keyframes ripple-out{ to{ transform:scale(3); opacity:0; } }
  .transport-list{display:flex;flex-direction:column;gap:0;}
  .transport-item{display:flex;gap:18px;padding:18px 0;border-bottom:1px solid var(--line);}
  .transport-item:first-child{border-top:1px solid var(--line);}
  .transport-mode{font-family:'Space Grotesk',sans-serif;font-size:12px;letter-spacing:1px;color:var(--ink-dim);min-width:64px;padding-top:2px;}
  .transport-desc{font-size:14.5px;}
  .location-addr{font-size:15px;margin-bottom:20px;}
  .location-addr .k{display:block;font-family:'Space Grotesk',sans-serif;font-size:11px;letter-spacing:2px;color:var(--ink-dim);margin-bottom:6px;text-transform:uppercase;}
  @media(min-width:820px){.location-grid{grid-template-columns:1fr 1fr;gap:56px;}}

  /* ============================================================
     FAQ
     ============================================================ */
  .faq-list{border-top:1px solid var(--line);}
  .faq-item{border-bottom:1px solid var(--line);}
  .faq-item summary{
    list-style:none;cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;gap:16px;
    padding:24px 0;font-size:16px;font-weight:500;
  }
  .faq-item summary::-webkit-details-marker{display:none;}
  .faq-item summary .plus{font-family:'Space Grotesk',sans-serif;font-size:20px;transition:transform 0.25s ease;flex-shrink:0;}
  .faq-item[open] summary .plus{transform:rotate(45deg);}
  .faq-item summary:focus-visible{outline:2px solid var(--ink);outline-offset:4px;}
  .faq-answer{padding:0 0 24px;color:var(--ink-dim);font-size:14.5px;max-width:60ch;}

  /* ============================================================
     BOOKING CTA
     ============================================================ */
  .booking{background:var(--ink);color:var(--cream);border-bottom:none;text-align:center;}
  .booking .eyebrow{color:rgba(246,241,228,0.6);justify-content:center;}
  .booking .eyebrow::before{background:var(--yellow);}
  .booking h2{color:var(--cream);font-size:clamp(32px,6vw,64px);max-width:18ch;margin:0 auto 20px;line-height:1.15;}
  .booking p{color:rgba(246,241,228,0.7);max-width:48ch;margin:0 auto 36px;font-size:15px;}
  .booking-note{margin-top:18px;font-size:12px;color:rgba(246,241,228,0.5);}

  /* ============================================================
     FOOTER
     ============================================================ */
  footer.site-footer{padding:56px 0 40px;}
  .footer-top{display:flex;flex-direction:column;gap:28px;margin-bottom:36px;}
  .footer-logo{font-family:'Noto Serif TC',serif;font-weight:900;font-size:20px;}
  .footer-links{display:flex;flex-wrap:wrap;gap:20px;font-size:13px;color:var(--ink-dim);}
  .footer-links a:hover,.footer-links a:focus-visible{color:var(--ink);}
  .footer-social{display:flex;gap:16px;font-size:13px;}
  @media(min-width:760px){.footer-top{flex-direction:row;justify-content:space-between;align-items:center;}}
  .footer-disclaimer{font-size:11.5px;color:var(--ink-dim);line-height:1.8;border-top:1px solid var(--line);padding-top:24px;max-width:70ch;}

  /* ============================================================
     DOT RAIL — signature wayfinding element (desktop only)
     ============================================================ */
  .dot-rail{
    position:fixed;right:22px;top:50%;transform:translateY(-50%);z-index:55;
    display:none;flex-direction:column;gap:14px;
  }
  .dot-rail a{
    width:8px;height:8px;border-radius:50%;background:var(--ink-faint);
    border:1px solid transparent;display:block;transition:background 0.25s ease, transform 0.25s ease;
  }
  .dot-rail a:hover,.dot-rail a:focus-visible{transform:scale(1.3);outline:none;}
  .dot-rail a.active{background:var(--yellow);border-color:var(--ink);}
  @media(min-width:1080px){.dot-rail{display:flex;}}
</style>
</head>
<body>

<!--
  ============================================================
  CONTENT — 單一資料檔
  這是全站唯一需要修改文字/圖片/連結/開關的地方。
  下方 render 邏輯只負責「畫出」這份資料，不含任何文案。
  ============================================================
-->
<script>
const CONTENT = {
  meta: {
    siteName: "示範旅宿 The Sample Stay",
  },

  sectionsEnabled: {
    nav: true,
    hero: true,
    intro: true,
    features: true,
    rooms: true,
    gallery: true,
    stayInfo: true,
    location: true,
    faq: true,
    booking: true,
    footer: true
  },

  nav: {
    logoText: "THE SAMPLE STAY",
    links: [
      { label: "簡介", href: "#intro" },
      { label: "特色", href: "#features" },
      { label: "房型", href: "#rooms" },
      { label: "相簿", href: "#gallery" },
      { label: "入住資訊", href: "#stay-info" },
      { label: "交通", href: "#location" },
      { label: "常見問題", href: "#faq" }
    ],
    ctaLabel: "立即詢問房型",
    ctaHref: "#booking"
  },

  hero: {
    kicker: "版型示範・PLACEHOLDER TEMPLATE",
    titleLine1: "在",
    titleMark: "海風",
    titleLine2: "與慢時光之間",
    subtitle: "這是一段示意文案：描述這間旅宿的氛圍與定位，例如選址理念、空間調性、或最想留給旅人的第一印象。實際使用時請替換為真實文案。",
    ctaLabel: "查看房型",
    ctaHref: "#rooms",
    ctaSecondaryLabel: "旅宿簡介",
    ctaSecondaryHref: "#intro",
    imageLabel: "首頁主視覺 示意圖",
    scrollLabel: "SCROLL"
  },

  intro: {
    eyebrow: "旅宿簡介",
    title: "關於這裡的\n一段示意文字",
    paragraphs: [
      "這裡放旅宿的核心介紹：成立背景、空間理念、或主人想傳達的生活態度。建議控制在兩到三段，讓讀者快速抓住這間旅宿與其他選擇的差異。",
      "第二段可以補充更具體的細節，例如建築特色、在地連結、或是旅人普遍會有的體驗感受。所有內容目前皆為示意文字，請替換為實際介紹。"
    ],
    imageLabel: "空間示意圖"
  },

  features: {
    eyebrow: "三項特色",
    title: "為什麼選擇這裡",
    items: [
      { title: "特色亮點一", desc: "示意說明文字，描述這項特色對旅人的實際好處，建議一到兩句話講清楚即可。" },
      { title: "特色亮點二", desc: "示意說明文字，可以是空間設計、服務細節、或地理位置上的優勢。" },
      { title: "特色亮點三", desc: "示意說明文字，放最能代表這間旅宿獨特性的一項特色。" }
    ]
  },

  rooms: {
    eyebrow: "房型介紹",
    title: "選一個屬於你的房型",
    items: [
      {
        name: "示範房型 A",
        desc: "示意描述文字：說明坪數、床型、可容納人數、與空間氛圍等資訊。",
        price: "示意價格",
        priceNote: "／晚，實際房價請以官網為準",
        capacity: "2 人",
        tags: ["示意標籤", "示意標籤"],
        imageLabel: "房型 A 示意圖"
      },
      {
        name: "示範房型 B",

      { mode: "大眾運輸", desc: "示意交通說明文字，例如鄰近車站、公車站牌與步行時間。" },

    ],
    disclaimer: "本頁面為一頁式旅宿網站模板，用於展示版面與排版結構。頁面中的旅宿名稱、文案、價格、照片與地址皆為示意內容，不代表任何真實旅宿，請勿作為實際訂房依據。"

<div id="app"></div>

<script>
(function(){
  "use strict";

  function ph(label, extraClass){
    // Centralized placeholder-image renderer.
    // Swap this function's innerHTML for a real <img> tag later —
    // every image in the site goes through this one place.
    return '<div class="ph ' + (extraClass||'') + '"><span class="ph-tag">' + label + '</span></div>';
  }

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  var S = CONTENT.sectionsEnabled || {};
  var out = [];

  /* ---------- NAV ---------- */
  if (S.nav && CONTENT.nav) {
    var n = CONTENT.nav;
    var navLinks = (n.links||[]).map(function(l){
      return '<a href="'+l.href+'">'+esc(l.label)+'</a>';
    }).join('');
    out.push(
      '<header class="site-nav">'+
        '<div class="nav-row">'+
          '<a class="nav-logo" href="#top">'+esc(n.logoText)+'</a>'+
          '<nav class="nav-links" aria-label="主要導覽">'+navLinks+'</nav>'+
          (n.ctaLabel ? '<a class="btn nav-cta" href="'+n.ctaHref+'">'+esc(n.ctaLabel)+'</a>' : '')+
          '<button class="nav-toggle" aria-label="開啟選單" aria-expanded="false" id="navToggle"><span></span></button>'+
        '</div>'+
        '<nav class="nav-mobile" id="navMobile" aria-label="行動版導覽">'+
          navLinks+
          (n.ctaLabel ? '<a class="btn" href="'+n.ctaHref+'">'+esc(n.ctaLabel)+'</a>' : '')+
        '</nav>'+
      '</header>'
    );
  }

  /* ---------- HERO ---------- */
  if (S.hero && CONTENT.hero) {
    var h = CONTENT.hero;
    out.push(
      '<section class="hero" id="top">'+
        '<div class="hero-copy">'+
          '<div class="eyebrow reveal">'+esc(h.kicker)+'</div>'+
          '<h1 class="hero-title reveal">'+esc(h.titleLine1)+'<mark>'+esc(h.titleMark)+'</mark>'+esc(h.titleLine2)+'</h1>'+
          '<p class="hero-sub reveal">'+esc(h.subtitle)+'</p>'+
          '<div class="hero-actions reveal">'+
            '<a class="btn" href="'+h.ctaHref+'">'+esc(h.ctaLabel)+'</a>'+
            '<a class="btn ghost" href="'+h.ctaSecondaryHref+'">'+esc(h.ctaSecondaryLabel)+'</a>'+
          '</div>'+
        '</div>'+
        '<div class="hero-media">'+
          ph(h.imageLabel)+
          '<div class="scroll-hint"><span>'+esc(h.scrollLabel)+'</span><span class="line"></span></div>'+
        '</div>'+
      '</section>'
    );
  }

  /* ---------- INTRO ---------- */
  if (S.intro && CONTENT.intro && (CONTENT.intro.paragraphs||[]).length) {
    var i = CONTENT.intro;
    var paras = i.paragraphs.map(function(p){ return '<p>'+esc(p)+'</p>'; }).join('');
    out.push(
      '<section id="intro">'+
        '<div class="wrap">'+
          '<div class="intro-grid">'+
            '<div class="intro-media reveal">'+ph(i.imageLabel)+'</div>'+
            '<div class="intro-text reveal">'+
              '<div class="eyebrow">'+esc(i.eyebrow)+'</div>'+
              '<h2 class="section-title" style="margin-bottom:24px;">'+esc(i.title).split("\n").join('<br>')+'</h2>'+
              paras+
            '</div>'+
          '</div>'+
        '</div>'+
      '</section>'
    );
  }

  /* ---------- FEATURES ---------- */
  if (S.features && CONTENT.features && (CONTENT.features.items||[]).length) {
    var f = CONTENT.features;
    var items = f.items.map(function(it, idx){
      return '<div class="feature-item reveal">'+
        '<div class="feature-index">0'+(idx+1)+'</div>'+
        '<div><h3>'+esc(it.title)+'</h3><p>'+esc(it.desc)+'</p></div>'+
      '</div>';
    }).join('');
    out.push(
      '<section id="features">'+
        '<div class="wrap">'+
          '<div class="section-head reveal">'+
            '<div class="eyebrow">'+esc(f.eyebrow)+'</div>'+
            '<h2 class="section-title">'+esc(f.title)+'</h2>'+
          '</div>'+
          '<div class="feature-list">'+items+'</div>'+
        '</div>'+
      '</section>'
    );
  }

  /* ---------- ROOMS ---------- */
  if (S.rooms && CONTENT.rooms && (CONTENT.rooms.items||[]).length) {
    var r = CONTENT.rooms;
    var rooms = r.items.map(function(room){
      var tags = (room.tags||[]).map(function(t){ return '<span class="room-tag">'+esc(t)+'</span>'; }).join('');
      return '<div class="room-item reveal">'+
        '<div class="room-media">'+ph(room.imageLabel)+'</div>'+
        '<div class="room-body">'+
          '<div class="room-name">'+esc(room.name)+'</div>'+
          '<p class="room-desc">'+esc(room.desc)+'</p>'+
          '<div class="room-meta">'+tags+'<span class="room-tag">'+esc(room.capacity)+'</span></div>'+
          '<div class="room-price">'+esc(room.price)+' <small>'+esc(room.priceNote)+'</small></div>'+
        '</div>'+
      '</div>';
    }).join('');
    out.push(
      '<section id="rooms">'+
        '<div class="wrap">'+
          '<div class="section-head reveal">'+
            '<div class="eyebrow">'+esc(r.eyebrow)+'</div>'+
            '<h2 class="section-title">'+esc(r.title)+'</h2>'+
          '</div>'+
          '<div class="room-list">'+rooms+'</div>'+
        '</div>'+
      '</section>'
    );
  }

  /* ---------- GALLERY ---------- */
  if (S.gallery && CONTENT.gallery && (CONTENT.gallery.images||[]).length) {
    var g = CONTENT.gallery;
    var imgs = g.images.map(function(im){ return ph(im.label, ''); }).join('');
    out.push(
      '<section id="gallery">'+
        '<div class="wrap">'+
          '<div class="section-head reveal">'+
            '<div class="eyebrow">'+esc(g.eyebrow)+'</div>'+
            '<h2 class="section-title">'+esc(g.title)+'</h2>'+
          '</div>'+
          '<div class="gallery-grid reveal">'+imgs+'</div>'+
        '</div>'+
      '</section>'
    );
  }

  /* ---------- STAY INFO ---------- */
  if (S.stayInfo && CONTENT.stayInfo && (CONTENT.stayInfo.facts||[]).length) {
    var si = CONTENT.stayInfo;
    var rows = si.facts.map(function(fc){
      return '<div class="info-row"><span class="k">'+esc(fc.k)+'</span><span class="v">'+esc(fc.v)+'</span></div>';
    }).join('');
    out.push(
      '<section id="stay-info">'+
        '<div class="wrap">'+
          '<div class="section-head reveal">'+
            '<div class="eyebrow">'+esc(si.eyebrow)+'</div>'+
            '<h2 class="section-title">'+esc(si.title)+'</h2>'+
          '</div>'+
          '<div class="info-list reveal">'+rows+'</div>'+
          (si.note ? '<p class="info-note">'+esc(si.note)+'</p>' : '')+
        '</div>'+
      '</section>'
    );
  }

  /* ---------- LOCATION ---------- */
  if (S.location && CONTENT.location) {
    var loc = CONTENT.location;
    var trans = (loc.transport||[]).map(function(t){
      return '<div class="transport-item"><div class="transport-mode">'+esc(t.mode)+'</div><div class="transport-desc">'+esc(t.desc)+'</div></div>';
    }).join('');
    var mapPinSvg = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">'+
      '<path d="M12 2C7.8 2 4.4 5.4 4.4 9.6C4.4 15 12 22 12 22C12 22 19.6 15 19.6 9.6C19.6 5.4 16.2 2 12 2Z" fill="#F4D000" stroke="#F6F1E4" stroke-width="1.2"/>'+
      '<circle cx="12" cy="9.6" r="3" fill="#15130F"/>'+
    '</svg>';
    var mapInner = '<div class="radar"><span class="radar-ring r1"></span><span class="radar-ring r2"></span>'+mapPinSvg+'</div>'+
      '<div class="location-card-title">'+esc(loc.districtLabel || '')+'</div>'+
      '<div class="location-card-sub">'+esc(loc.mapLabel)+'</div>'+
      '<span class="btn on-dark">在 Google 地圖開啟 ↗</span>';
    var mapBlock = loc.mapUrl
      ? '<a class="location-card ripple-btn" href="'+loc.mapUrl+'" target="_blank" rel="noopener" aria-label="在 Google 地圖開啟'+esc(CONTENT.meta.siteName)+'">'+mapInner+'</a>'
      : '<div class="location-card">'+mapInner+'</div>';
    out.push(
      '<section id="location">'+
        '<div class="wrap">'+
          '<div class="section-head reveal">'+
            '<div class="eyebrow">'+esc(loc.eyebrow)+'</div>'+
            '<h2 class="section-title">'+esc(loc.title)+'</h2>'+
          '</div>'+
          '<div class="location-grid">'+
            '<div class="reveal">'+mapBlock+'</div>'+
            '<div class="reveal">'+
              '<div class="location-addr"><span class="k">'+esc(loc.addressLabel)+'</span>'+esc(loc.address)+'</div>'+
              '<div class="transport-list">'+trans+'</div>'+
            '</div>'+
          '</div>'+
        '</div>'+
      '</section>'
    );
  }

  /* ---------- FAQ ---------- */
  if (S.faq && CONTENT.faq && (CONTENT.faq.items||[]).length) {
    var fq = CONTENT.faq;
    var faqItems = fq.items.map(function(it, idx){
      return '<details class="faq-item"'+(idx===0?' open':'')+'>'+
        '<summary>'+esc(it.q)+'<span class="plus">+</span></summary>'+
        '<div class="faq-answer">'+esc(it.a)+'</div>'+
      '</details>';
    }).join('');
    out.push(
      '<section id="faq">'+
        '<div class="wrap">'+
          '<div class="section-head reveal">'+
            '<div class="eyebrow">'+esc(fq.eyebrow)+'</div>'+
            '<h2 class="section-title">'+esc(fq.title)+'</h2>'+
          '</div>'+
          '<div class="faq-list reveal">'+faqItems+'</div>'+
        '</div>'+
      '</section>'
    );
  }

  /* ---------- BOOKING CTA ---------- */
  if (S.booking && CONTENT.booking) {
    var b = CONTENT.booking;
    out.push(
      '<section class="booking" id="booking">'+
        '<div class="wrap reveal">'+
          '<div class="eyebrow">'+esc(b.eyebrow)+'</div>'+
          '<h2>'+esc(b.title)+'</h2>'+
          '<p>'+esc(b.subtitle)+'</p>'+
          '<a class="btn on-dark" href="'+b.ctaHref+'">'+esc(b.ctaLabel)+'</a>'+
          '<div class="booking-note">'+esc(b.note)+'</div>'+
        '</div>'+
      '</section>'
    );
  }

  /* ---------- FOOTER ---------- */
  if (S.footer && CONTENT.footer) {
    var ft = CONTENT.footer;
    var flinks = (ft.links||[]).map(function(l){ return '<a href="'+l.href+'">'+esc(l.label)+'</a>'; }).join('');
    var fsocial = (ft.social||[]).map(function(s){ return '<a href="'+s.href+'">'+esc(s.label)+'</a>'; }).join('');
    out.push(
      '<footer class="site-footer">'+
        '<div class="wrap">'+
          '<div class="footer-top">'+
            '<div class="footer-logo">'+esc(ft.logoText)+'</div>'+
            '<div class="footer-links">'+flinks+'</div>'+
            '<div class="footer-social">'+fsocial+'</div>'+
          '</div>'+
          '<p class="footer-disclaimer">'+esc(ft.disclaimer)+'</p>'+
        '</div>'+
      '</footer>'
    );
  }

  document.getElementById('app').innerHTML = out.join('');

  /* ---------- interactions ---------- */

  // ripple click effect (event-delegated for any .ripple-btn)
  document.addEventListener('click', function(e){
    var btn = e.target.closest('.ripple-btn');
    if (!btn) return;
    var rect = btn.getBoundingClientRect();
    var size = Math.max(rect.width, rect.height);
    var span = document.createElement('span');
    span.className = 'ripple';
    span.style.width = span.style.height = size + 'px';
    span.style.left = (e.clientX - rect.left - size / 2) + 'px';
    span.style.top = (e.clientY - rect.top - size / 2) + 'px';
    btn.appendChild(span);
    span.addEventListener('animationend', function(){ span.remove(); });
  });

  // detect common in-app browsers (LINE, Instagram, Facebook/Messenger, WeChat)
  // where Google Maps short links often fail to open — show a dismissible notice
  (function(){
    var ua = navigator.userAgent || '';
    var isInApp = /Line\//i.test(ua) || /Instagram/i.test(ua) || /FBAN|FBAV|FB_IAB/i.test(ua) || /MicroMessenger/i.test(ua) || /MessengerForiOS/i.test(ua);
    var alreadyDismissed = false;
    try { alreadyDismissed = sessionStorage.getItem('iabBannerDismissed') === '1'; } catch(e){}
    if (!isInApp || alreadyDismissed) return;

    var banner = document.createElement('div');
    banner.className = 'iab-banner';
    banner.innerHTML =
      '<span>偵測到您可能透過 App 內建瀏覽器開啟本頁，地圖連結可能無法正常開啟。建議點右上角「⋯」選擇「在瀏覽器中開啟」。</span>'+
      '<button class="iab-close" aria-label="關閉提示">×</button>';
    document.body.insertBefore(banner, document.body.firstChild);
    banner.querySelector('.iab-close').addEventListener('click', function(){
      banner.remove();
      try { sessionStorage.setItem('iabBannerDismissed', '1'); } catch(e){}
    });
  })();

  // mobile nav toggle
  var navToggle = document.getElementById('navToggle');
  var navMobile = document.getElementById('navMobile');
  if (navToggle && navMobile) {
    navToggle.addEventListener('click', function(){
      var open = navMobile.classList.toggle('open');
      navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    navMobile.querySelectorAll('a').forEach(function(a){
      a.addEventListener('click', function(){
        navMobile.classList.remove('open');
        navToggle.setAttribute('aria-expanded','false');
      });
    });
  }

  // scroll reveal
  var revealEls = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window && revealEls.length) {
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if (entry.isIntersecting) {
          entry.target.classList.add('in-view');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
    revealEls.forEach(function(el){ io.observe(el); });
  } else {
    revealEls.forEach(function(el){ el.classList.add('in-view'); });
  }

  // dot rail — built from enabled sections that exist in the DOM
  var railTargets = [];
  (CONTENT.nav && CONTENT.nav.links || []).forEach(function(l){
    var id = l.href.replace('#','');
    if (document.getElementById(id)) railTargets.push({ id: id, label: l.label });
  });
  if (railTargets.length) {
    var rail = document.createElement('div');
    rail.className = 'dot-rail';
    rail.setAttribute('aria-hidden','true');
    rail.innerHTML = railTargets.map(function(t){
      return '<a href="#'+t.id+'" data-target="'+t.id+'" title="'+t.label+'"></a>';
    }).join('');
    document.body.appendChild(rail);

    var dots = rail.querySelectorAll('a');
    var sectionsEls = railTargets.map(function(t){ return document.getElementById(t.id); });
    if ('IntersectionObserver' in window) {
      var railIo = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          if (entry.isIntersecting) {
            dots.forEach(function(d){ d.classList.remove('active'); });
            var match = rail.querySelector('[data-target="'+entry.target.id+'"]');
            if (match) match.classList.add('active');
          }
        });
      }, { threshold: 0.5 });
      sectionsEls.forEach(function(el){ if (el) railIo.observe(el); });
    }
  }

})();
</script>
