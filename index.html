<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>餘光．台南漁光島民宿｜mika 今晚住這裡（非官方攻略）</title>
<meta name="description" content="餘光．台南漁光島民宿的非官方住宿攻略，由 mika 今晚住這裡 整理，含房型、入住資訊與交通位置，實際訂房請以官網為準。">
<meta property="og:title" content="餘光．台南漁光島民宿｜mika 今晚住這裡">
<meta property="og:description" content="非官方住宿攻略頁面，實際訂房資訊請以官網為準。">
<meta property="og:type" content="website">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@300;400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     DESIGN TOKENS
     ============================================================ */
  :root{
    --cream:#F6F1E4;
    --ink:#15130F;
    --ink-dim:rgba(21,19,15,0.62);
    --ink-faint:rgba(21,19,15,0.15);
    --yellow:#F4D000;
    --yellow-ink:#15130F;
    --line:rgba(21,19,15,0.15);
    --radius:2px;
    --container:1180px;
    --gutter:6vw;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.01ms !important;transition-duration:0.01ms !important;scroll-behavior:auto !important;}
  }
  body{
    background-color:var(--cream);
    color:var(--ink);
    font-family:'Noto Sans TC',sans-serif;
    font-weight:300;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  ul{list-style:none;}
  img{max-width:100%;display:block;}
  .wrap{max-width:var(--container);margin:0 auto;padding:0 var(--gutter);}
  .eyebrow{
    font-family:'Space Grotesk',sans-serif;
    font-size:12px;letter-spacing:3px;text-transform:uppercase;
    color:var(--ink-dim);margin-bottom:14px;display:flex;align-items:center;gap:10px;
  }
  .eyebrow::before{content:'';width:22px;height:1px;background:var(--ink);display:inline-block;}
  h1,h2,h3{font-family:'Noto Serif TC',serif;font-weight:900;color:var(--ink);letter-spacing:0.5px;}
  .btn{
    display:inline-flex;align-items:center;gap:10px;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;letter-spacing:1px;
    padding:16px 30px;border-radius:var(--radius);
    background:var(--ink);color:var(--cream);
    transition:background 0.25s ease, color 0.25s ease, transform 0.25s ease;
    border:1px solid var(--ink);
  }
  .btn:hover,.btn:focus-visible{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow);outline:none;}
  .btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
  .btn.ghost{background:transparent;color:var(--ink);}
  .btn.ghost:hover,.btn.ghost:focus-visible{background:var(--ink);color:var(--cream);}
  .btn.on-dark{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow);}
  .btn.on-dark:hover,.btn.on-dark:focus-visible{background:var(--cream);color:var(--ink);border-color:var(--cream);}

  section{background-color:var(--cream);padding:96px 0;border-bottom:1px solid var(--line);scroll-margin-top:88px;}
  .section-head{display:flex;flex-direction:column;gap:6px;margin-bottom:52px;max-width:640px;}
  .section-title{font-size:clamp(28px,4.4vw,46px);line-height:1.25;}

  /* reveal-on-scroll */
  .reveal{opacity:0;transform:translateY(22px);transition:opacity 0.7s ease, transform 0.7s ease;}
  .reveal.in-view{opacity:1;transform:translateY(0);}
  @media (prefers-reduced-motion: reduce){
    .reveal{opacity:1;transform:none;}
  }

  /* ============================================================
     PLACEHOLDER IMAGE SYSTEM — centralized, single class,
     swap for a real <img> later by editing render logic only.
     ============================================================ */
  .ph{
    position:relative;overflow:hidden;
    background:
      repeating-linear-gradient(135deg, rgba(21,19,15,0.05) 0 1px, transparent 1px 18px),
      var(--cream-ph, #EDE5D2);
    border:1px solid var(--ink-faint);
    display:flex;align-items:flex-end;
  }
  .ph::before{
    content:'';position:absolute;inset:0;
    background:
      linear-gradient(120deg, rgba(244,208,0,0.16), transparent 55%),
      linear-gradient(300deg, rgba(21,19,15,0.06), transparent 60%);
  }
  .ph-tag{
    position:relative;z-index:1;
    font-family:'Space Grotesk',sans-serif;
    font-size:11px;letter-spacing:1.5px;
    color:var(--ink-dim);
    background:rgba(246,241,228,0.85);
    border:1px solid var(--ink-faint);
    padding:6px 11px;margin:14px;border-radius:20px;
  }

  /* ============================================================
     NAV
     ============================================================ */
  header.site-nav{
    position:sticky;top:0;z-index:60;
    background:rgba(246,241,228,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .nav-row{display:flex;align-items:center;justify-content:space-between;padding:16px var(--gutter);}
  .nav-logo{font-family:'Noto Serif TC',serif;font-weight:900;font-size:18px;letter-spacing:1px;}
  .nav-links{display:none;gap:28px;font-size:13px;letter-spacing:1px;}
  .nav-links a{padding:4px 0;border-bottom:1px solid transparent;}
  .nav-links a:hover,.nav-links a:focus-visible{border-bottom-color:var(--ink);}
  .nav-cta{display:none;}
  .nav-toggle{
    background:none;border:1px solid var(--ink);border-radius:var(--radius);
    width:40px;height:36px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .nav-toggle span,.nav-toggle span::before,.nav-toggle span::after{
    content:'';display:block;width:18px;height:2px;background:var(--ink);position:relative;transition:transform 0.25s ease, opacity 0.25s ease;
  }
  .nav-toggle span::before{position:absolute;top:-6px;}
  .nav-toggle span::after{position:absolute;top:6px;}
  .nav-toggle[aria-expanded="true"] span{background:transparent;}
  .nav-toggle[aria-expanded="true"] span::before{transform:translateY(6px) rotate(45deg);}
  .nav-toggle[aria-expanded="true"] span::after{transform:translateY(-6px) rotate(-45deg);}
  .nav-mobile{display:none;flex-direction:column;padding:8px var(--gutter) 24px;border-top:1px solid var(--line);}
  .nav-mobile.open{display:flex;}
  .nav-mobile a{padding:12px 0;font-size:15px;border-bottom:1px solid var(--line);}
  .nav-mobile .btn{margin-top:16px;justify-content:center;}
  .nav-mobile-secondary{
    display:block;text-align:center;margin-top:12px;padding:6px 0;
    font-family:'Space Grotesk',sans-serif;font-size:13px;letter-spacing:1px;
    color:var(--ink-dim);border-bottom:none;
  }
  .nav-mobile-secondary:hover,.nav-mobile-secondary:focus-visible{color:var(--ink);}
  @media(min-width:860px){
    .nav-links{display:flex;}
    .nav-cta{display:inline-flex;}
    .nav-toggle{display:none;}
  }

  /* ============================================================
     HERO
     ============================================================ */
  .hero{background-color:var(--cream);padding:64px 0 0;border-bottom:none;}
  .hero-copy{background-color:var(--cream);padding:0 var(--gutter);margin-bottom:36px;}
  .hero-title{
    font-size:clamp(38px,10.5vw,54px);
    line-height:1.22;letter-spacing:0.5px;
    max-width:none;
  }
  .hero-title .title-phrase{white-space:nowrap;}
  .hero-title .title-break{display:block;}
  .hero-title mark{background:none;color:var(--ink);position:relative;display:inline-block;}
  .hero-title mark::after{
    content:'';position:absolute;left:-2%;right:-2%;bottom:0.06em;height:0.28em;
    background:var(--yellow);z-index:-1;
  }
  .hero-sub{margin-top:14px;margin-bottom:0;font-size:16px;line-height:1.9;color:var(--ink-dim);max-width:46ch;text-align:left;text-wrap:pretty;}
  .hero-sub:first-of-type{margin-top:24px;}
  .hero-actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:32px;}
  .hero-actions .btn{min-width:200px;justify-content:center;text-align:center;}
  .hero-media{position:relative;}
  .hero-media .ph{width:100%;height:52vh;min-height:340px;border-left:none;border-right:none;}
  .hero--no-image{padding-bottom:64px;}
  @media(min-width:760px){
    .hero-title{font-size:clamp(46px,7vw,100px);line-height:1.05;max-width:16ch;}
    .hero-title .title-break{display:none;}
  }
  .scroll-hint--inline{position:static;margin-top:44px;flex-direction:row;align-items:center;}
  .scroll-hint--inline .line{width:34px;height:1px;}
  .scroll-hint{
    position:absolute;right:var(--gutter);bottom:18px;z-index:2;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    font-family:'Space Grotesk',sans-serif;font-size:11px;letter-spacing:2px;color:var(--ink);
  }
  .scroll-hint .line{width:1px;height:34px;background:var(--ink);animation:scrollpulse 1.8s ease-in-out infinite;}
  @keyframes scrollpulse{0%,100%{transform:scaleY(1);opacity:0.4;}50%{transform:scaleY(0.5);opacity:1;}}

  /* ============================================================
     INTRO
     ============================================================ */
  .intro-grid{display:grid;grid-template-columns:1fr;gap:36px;align-items:start;}
  .intro-grid--text-only{max-width:70ch;}
  .intro-media .ph{aspect-ratio:4/5;}
  .intro-text p{color:var(--ink-dim);font-size:16px;line-height:1.9;margin-bottom:18px;max-width:52ch;}
  .intro-text p:last-child{margin-bottom:0;}
  .intro-title-line{white-space:nowrap;}
  @media(min-width:820px){
    .intro-grid{grid-template-columns:0.9fr 1.1fr;gap:64px;}
    .intro-grid--text-only{grid-template-columns:1fr;}
  }

  /* ============================================================
     FEATURES (3 highlights)
     ============================================================ */
  .feature-list{display:grid;grid-template-columns:1fr;gap:0;border-top:1px solid var(--line);}
  .feature-item{
    display:grid;grid-template-columns:auto 1fr;gap:20px;
    padding:32px 0;border-bottom:1px solid var(--line);
  }
  .feature-index{font-family:'Space Grotesk',sans-serif;font-size:13px;color:var(--ink-dim);padding-top:6px;}
  .feature-item h3{font-size:20px;margin-bottom:8px;}
  .feature-item p{color:var(--ink-dim);font-size:14.5px;max-width:52ch;}
  @media(min-width:760px){
    .feature-list{grid-template-columns:repeat(3,1fr);border-top:none;}
    .feature-item{grid-template-columns:1fr;border-bottom:none;border-top:2px solid var(--ink);padding:24px 22px 0 0;}
  }

  /* ============================================================
     ROOMS
     ============================================================ */
  .room-list{display:flex;flex-direction:column;gap:64px;}
  .room-item{display:grid;grid-template-columns:1fr;gap:28px;}
  .room-media .ph{aspect-ratio:5/4;}
  .room-body{display:flex;flex-direction:column;gap:14px;}
  .room-name{font-size:clamp(24px,3vw,32px);}
  .room-desc{color:var(--ink-dim);font-size:14.5px;max-width:48ch;}
  .room-meta{display:flex;flex-wrap:wrap;gap:10px;}
  .room-tag{font-family:'Space Grotesk',sans-serif;font-size:11px;letter-spacing:1px;border:1px solid var(--ink);padding:5px 12px;border-radius:20px;}
  .room-price{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin-top:4px;}
  .room-price small{font-size:12px;font-weight:400;color:var(--ink-dim);letter-spacing:0.5px;}
  @media(min-width:820px){
    .room-item{grid-template-columns:1.1fr 0.9fr;align-items:center;gap:56px;}
    .room-item:nth-child(even){direction:rtl;}
    .room-item:nth-child(even) > *{direction:ltr;}
  }

  /* ============================================================
     TABSET — generic tab toggle used by review + itinerary
     ============================================================ */
  .tab-buttons{display:flex;gap:8px;margin-bottom:32px;flex-wrap:wrap;}
  .tab-btn{
    font-family:'Space Grotesk',sans-serif;font-size:13px;letter-spacing:1px;
    padding:9px 18px;border:1px solid var(--ink);border-radius:20px;
    background:transparent;color:var(--ink);cursor:pointer;
  }
  .tab-btn.active{background:var(--ink);color:var(--cream);}
  .tab-btn:focus-visible{outline:2px solid var(--yellow);outline-offset:2px;}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  /* ============================================================
     REVIEW
     ============================================================ */
  .pros-cons{display:grid;grid-template-columns:1fr;gap:20px;margin-bottom:28px;}
  @media(min-width:700px){.pros-cons{grid-template-columns:1fr 1fr;}}
  .pc-card{border:1px solid var(--ink);border-radius:var(--radius);padding:24px 26px;}
  .pc-card h3{font-size:16px;margin-bottom:14px;}
  .pc-card.cons h3{color:var(--ink);}
  .pc-card ul{list-style:none;font-size:13.5px;color:var(--ink-dim);}
  .pc-card li{padding:6px 0;padding-left:20px;position:relative;}
  .pc-card.pros li::before{content:'＋';position:absolute;left:0;font-weight:700;}
  .pc-card.cons li::before{content:'•';position:absolute;left:2px;font-weight:700;}
  .pc-card.pros{background:var(--cream);}
  .pc-card.cons{background:transparent;}
  .review-note{border-left:3px solid var(--yellow);padding:16px 22px;font-size:14px;color:var(--ink-dim);margin-bottom:16px;background:rgba(244,208,0,0.06);}
  .review-note b{color:var(--ink);font-weight:700;}

  /* -- review-full: editorial article layout -- */
  .review-full{max-width:720px;}
  .review-article{
    display:grid;grid-template-columns:1fr;gap:10px;
    padding-top:56px;
  }
  .review-article:first-child{padding-top:0;}
  .review-article-num{
    font-family:'Space Grotesk',sans-serif;font-size:13px;letter-spacing:2px;
    color:var(--ink-dim);
  }
  .review-article h4{
    font-family:'Noto Serif TC',serif;font-weight:900;
    font-size:22px;line-height:1.4;margin:0;
  }
  .review-article-rule{width:34px;height:2px;background:var(--ink);margin:14px 0 18px;}
  .review-article p{
    color:var(--ink-dim);font-size:16px;line-height:1.9;margin-bottom:16px;max-width:70ch;
  }
  .review-article p:last-child{margin-bottom:0;}
  .review-article.is-note .review-article-body{
    border-left:3px solid var(--yellow);padding-left:20px;
  }
  .review-article.is-quote .review-lead{
    font-family:'Noto Serif TC',serif;font-weight:700;
    font-size:19px;line-height:1.7;color:var(--ink);margin-bottom:18px;
  }
  @media(min-width:760px){
    .review-article{grid-template-columns:64px 1fr;gap:28px;padding-top:72px;}
    .review-article-num{padding-top:6px;}
    .review-article h4{font-size:26px;}
  }

  /* ============================================================
     ITINERARY
     ============================================================ */
  .day-subtitle{font-size:13px;color:var(--ink-dim);margin:-20px 0 24px;letter-spacing:0.5px;}

  .stop{
    display:grid;grid-template-columns:1fr;row-gap:14px;
    align-items:start;
    padding:28px 0;border-bottom:1px solid var(--line);
  }
  .stop:first-child{border-top:1px solid var(--line);}

  .stop-time{
    font-family:'Space Grotesk',sans-serif;font-size:12px;letter-spacing:2px;
    color:var(--ink-dim);padding-top:4px;
  }

  .stop-name{
    font-family:'Noto Serif TC',serif;font-weight:900;
    line-height:1.35;letter-spacing:normal;text-align:left;
    margin-bottom:16px;text-wrap:balance;
  }
  .stop-name.title-normal{font-size:clamp(24px,6vw,36px);}
  .stop-name.title-long{font-size:clamp(21px,5.3vw,31px);}
  .stop-name.title-xlong{font-size:clamp(19px,4.8vw,27px);}
  .stop-name .title-phrase{white-space:nowrap;}
  .stop-name .title-break{display:block;}

  /* fixed label/value meta grid — same size/weight/color across all fields */
  .stop-meta{display:flex;flex-direction:column;gap:6px;}
  .stop-meta-row{
    display:grid;grid-template-columns:76px minmax(0,1fr);column-gap:14px;
    align-items:start;font-size:14px;line-height:1.7;
  }
  .stop-meta-row .mk{color:var(--ink-dim);}
  .stop-meta-row .mv{color:var(--ink);}

  .itinerary-note{margin-top:30px;font-size:12.5px;line-height:1.8;color:var(--ink-dim);text-align:left;}

  .stop-note{
    font-size:16px;line-height:1.8;color:var(--ink-dim);
    max-width:620px;margin:0;
  }
  .stop-meta + .stop-note{margin-top:28px;}

  /* button lives in its own container — spacing controlled here, not by the note's margin */
  .place-actions{margin-top:34px;}
  .stop-note + .place-actions{margin-top:26px;}

  .stop-link{
    display:inline-flex;align-items:center;gap:8px;
    font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;
    height:40px;padding:0 20px;border-radius:20px;box-sizing:border-box;
    background:var(--yellow);color:var(--ink);border:1px solid var(--yellow);
    transition:background 0.2s ease, color 0.2s ease;
  }
  .stop-link:hover,.stop-link:focus-visible{background:var(--ink);color:var(--cream);border-color:var(--ink);outline:none;}
  .stop-link .arrow{font-size:14px;line-height:1;}

  @media(min-width:760px){
    .stop{grid-template-columns:100px 1fr;column-gap:28px;padding:40px 0;}
    .stop-time{padding-top:8px;}
    .stop-name{margin-bottom:20px;}
    .stop-name .title-break{display:none;}
    .stop-meta-row{font-size:16px;grid-template-columns:88px minmax(0,1fr);}
    .stop-note{font-size:17.5px;}
    .stop-meta + .stop-note{margin-top:32px;}
    .place-actions{margin-top:38px;}
    .stop-note + .place-actions{margin-top:28px;}
  }

  /* ripple click effect */
  .ripple-btn {
    position: relative;
    overflow: hidden;
  }
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,138,0,0.4);
    transform: scale(0);
    pointer-events: none;
    animation: ripple-out 0.6s ease-out;
  }
  @keyframes ripple-out {
    to { transform: scale(3); opacity: 0; }
  }

  /* ============================================================
     GALLERY
     ============================================================ */
  .gallery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .gallery-grid .ph{aspect-ratio:1/1;}
  .gallery-grid .ph:nth-child(3n+1){aspect-ratio:1/1.3;}
  @media(min-width:700px){
    .gallery-grid{grid-template-columns:repeat(4,1fr);}
    .gallery-grid .ph:nth-child(4n+1){grid-row:span 2;aspect-ratio:auto;}
  }

  /* ============================================================
     STAY INFO
     ============================================================ */
  .info-list{display:grid;grid-template-columns:1fr;gap:0;}
  @media(min-width:700px){.info-list{grid-template-columns:1fr 1fr;column-gap:48px;}}
  .info-row{display:flex;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);font-size:14.5px;}
  .info-row .k{color:var(--ink-dim);letter-spacing:0.5px;white-space:nowrap;}
  .info-row .v{font-weight:500;text-align:right;}
  .info-row--long{align-items:flex-start;padding:22px 0;}
  .info-row--long .v{text-align:left;font-weight:400;line-height:1.75;}
  @media(min-width:700px){.info-row--long{padding:24px 0;}}
  .info-note{margin-top:30px;font-size:12.5px;color:var(--ink-dim);max-width:60ch;line-height:1.8;text-align:left;}

  /* ============================================================
     LOCATION
     ============================================================ */
  .location-grid{display:grid;grid-template-columns:1fr;gap:32px;}
  .location-card{
    background:var(--ink);color:var(--cream);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    gap:14px;padding:56px 32px;border-radius:var(--radius);
    text-decoration:none;cursor:pointer;
  }
  .location-card-title{font-family:'Noto Serif TC',serif;font-weight:900;font-size:24px;letter-spacing:1px;}
  .location-card-sub{font-family:'Space Grotesk',sans-serif;font-size:11px;letter-spacing:3px;color:rgba(246,241,228,0.55);text-transform:uppercase;}
  .location-card .btn{margin-top:4px;}
  .location-card .btn.on-dark:hover,.location-card .btn.on-dark:focus-visible{background:var(--cream);color:var(--ink);}

  .transport-list{display:flex;flex-direction:column;gap:0;}
  .transport-item{
    display:grid;grid-template-columns:76px 1fr;column-gap:14px;align-items:start;
    padding:16px 0;border-bottom:1px solid var(--line);
  }
  .transport-item:first-child{border-top:1px solid var(--line);}
  .transport-mode{font-family:'Space Grotesk',sans-serif;font-size:12px;letter-spacing:1px;color:var(--ink-dim);line-height:1.7;}
  .transport-desc{font-size:14.5px;line-height:1.7;color:var(--ink);}
  @media(min-width:760px){.transport-item{grid-template-columns:88px 1fr;}}
  @media(min-width:820px){.location-grid{grid-template-columns:1fr 1fr;gap:56px;}}

  /* ============================================================
     FAQ
     ============================================================ */
  .faq-list{border-top:1px solid var(--line);}
  .faq-item{border-bottom:1px solid var(--line);}
  .faq-item summary{

      { q: "有提供停車位嗎？", a: "館內提供 3 格汽車車位、5 格機車車位，不提供保留，依現場空位使用；車位滿了的話，民宿後方空地與公園旁未畫紅線處也可停車，步行回民宿約 2 分鐘。" },
      { q: "早餐吃什麼？", a: "可以在虱目魚粥或牛肉湯中擇一，都是台南在地口味。" },
      { q: "可以租機車代步嗎？", a: "館內提供 Gogoro 外租服務，每日約 $750－$850，連續租 3－4 天有優惠價約 $350／日。" },
      { q: "距離海灘會很遠嗎？", a: "不會，距離漁光島海灘約步行 600 公尺，看完夕陽走回民宿很方便。" }

  booking: {
    eyebrow: "準備好了嗎",
    titleLine1: "找一個時間，",
    titleLine2: "去漁光島住一晚",
    subtitle: "房價、空房與最新優惠請以官方網站公告為準。",
    ctaLabel: "立即預訂",
    ctaHref: "https://www.booking-owlnest.com/餘光?lang=zh_TW&adult=1&child=0&infant=0"
  },

  footer: {
    logoText: "餘光 YUGUANG",
    social: [
      { label: "Mika 今晚住這裡", href: "https://www.instagram.com/mika.checkin/reels/" }
    ],
    disclaimerParagraphs: [
      "此頁面為 Mika 今晚住這裡 製作，非「餘光．台南漁光島民宿」官方網站。",
      "本頁內容依實際入住體驗及公開資訊整理，房型、設施與營運資訊可能有所調整，實際內容請以餘光民宿官方公告為準。"
    ]
  }
};

<div id="app"></div>

<script>
(function(){
  "use strict";

  function ph(label, extraClass){
    // Centralized placeholder-image renderer.
    // Swap this function's innerHTML for a real <img> tag later —
    // every image in the site goes through this one place.
    return '<div class="ph ' + (extraClass||'') + '"><span class="ph-tag">' + label + '</span></div>';
  }

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  var S = CONTENT.sectionsEnabled || {};
  var out = [];

  /* ---------- NAV ---------- */
  if (S.nav && CONTENT.nav) {
    var n = CONTENT.nav;
    var navLinks = (n.links||[]).map(function(l){
      return '<a href="'+l.href+'">'+esc(l.label)+'</a>';
    }).join('');
    var navCta = n.ctaLabel ? '<a class="btn nav-cta" href="'+n.ctaHref+'" target="_blank" rel="noopener noreferrer">'+esc(n.ctaLabel)+'</a>' : '';
    var navCtaMobile = n.ctaLabel ? '<a class="btn" href="'+n.ctaHref+'" target="_blank" rel="noopener noreferrer">'+esc(n.ctaLabel)+'</a>' : '';
    var navSecondaryMobile = n.secondaryLabel ? '<a class="nav-mobile-secondary" href="'+n.secondaryHref+'" target="_blank" rel="noopener noreferrer">'+esc(n.secondaryLabel)+'</a>' : '';
    out.push(
      '<header class="site-nav">'+
        '<div class="nav-row">'+
          '<a class="nav-logo" href="#top">'+esc(n.logoText)+'</a>'+
          '<nav class="nav-links" aria-label="主要導覽">'+navLinks+'</nav>'+
          navCta+
          '<button class="nav-toggle" aria-label="開啟選單" aria-expanded="false" id="navToggle"><span></span></button>'+
        '</div>'+
        '<nav class="nav-mobile" id="navMobile" aria-label="行動版導覽">'+
          navLinks+
          navCtaMobile+
          navSecondaryMobile+
        '</nav>'+
      '</header>'
    );
  }

  /* ---------- HERO ---------- */
  if (S.hero && CONTENT.hero) {
    var h = CONTENT.hero;
    var heroShowImage = h.showImage !== false;
    var heroTitle = '<span class="title-phrase">'+esc(h.titleLine1)+'<mark>'+esc(h.titleMark)+'</mark>'+esc(h.titleLine2)+'</span>'+
      '<wbr><br class="title-break">'+
      '<span class="title-phrase">'+esc(h.titleLine3)+'</span>';
    var heroSubParas = (h.subtitleParagraphs||[]).map(function(p){ return '<p class="hero-sub reveal">'+esc(p)+'</p>'; }).join('');
    out.push(
      '<section class="hero' + (heroShowImage ? '' : ' hero--no-image') + '" id="top">'+
        '<div class="hero-copy">'+
          '<div class="eyebrow reveal">'+esc(h.kicker)+'</div>'+
          '<h1 class="hero-title reveal">'+heroTitle+'</h1>'+
          heroSubParas+
          '<div class="hero-actions reveal">'+
            '<a class="btn" href="'+h.ctaHref+'" target="_blank" rel="noopener noreferrer">'+esc(h.ctaLabel)+'</a>'+
            '<a class="btn ghost" href="'+h.ctaSecondaryHref+'" target="_blank" rel="noopener noreferrer">'+esc(h.ctaSecondaryLabel)+'</a>'+
          '</div>'+
          (heroShowImage ? '' : '<div class="scroll-hint scroll-hint--inline"><span>'+esc(h.scrollLabel)+'</span><span class="line"></span></div>')+
        '</div>'+
        (heroShowImage ? '<div class="hero-media">'+ph(h.imageLabel)+'<div class="scroll-hint"><span>'+esc(h.scrollLabel)+'</span><span class="line"></span></div></div>' : '')+
      '</section>'
    );
  }

  /* ---------- INTRO ---------- */
  if (S.intro && CONTENT.intro && (CONTENT.intro.paragraphs||[]).length) {
    var i = CONTENT.intro;
    var introShowImage = i.showImage !== false;
    var paras = i.paragraphs.map(function(p){ return '<p>'+esc(p)+'</p>'; }).join('');
    var introTitle = '<span class="intro-title-line">'+esc(i.titleLine1)+'</span><br>'+
      '<span class="intro-title-line">'+esc(i.titleLine2)+'</span>';
    out.push(
      '<section id="intro">'+
        '<div class="wrap">'+
          '<div class="intro-grid' + (introShowImage ? '' : ' intro-grid--text-only') + '">'+
            (introShowImage ? '<div class="intro-media reveal">'+ph(i.imageLabel)+'</div>' : '')+
            '<div class="intro-text reveal">'+
              '<div class="eyebrow">'+esc(i.eyebrow)+'</div>'+
              '<h2 class="section-title" style="margin-bottom:24px;">'+introTitle+'</h2>'+
              paras+
            '</div>'+
          '</div>'+
        '</div>'+
      '</section>'
    );
  }

  /* ---------- FEATURES ---------- */
  if (S.features && CONTENT.features && (CONTENT.features.items||[]).length) {
    var f = CONTENT.features;
    var items = f.items.map(function(it, idx){
      return '<div class="feature-item reveal">'+
        '<div class="feature-index">0'+(idx+1)+'</div>'+
        '<div><h3>'+esc(it.title)+'</h3><p>'+esc(it.desc)+'</p></div>'+
      '</div>';
    }).join('');
    out.push(
      '<section id="features">'+
        '<div class="wrap">'+
          '<div class="section-head reveal">'+
            '<div class="eyebrow">'+esc(f.eyebrow)+'</div>'+
            '<h2 class="section-title">'+esc(f.title)+'</h2>'+
          '</div>'+
          '<div class="feature-list">'+items+'</div>'+
        '</div>'+
      '</section>'
    );
  }

  /* ---------- ROOMS ---------- */
  if (S.rooms && CONTENT.rooms && (CONTENT.rooms.items||[]).length) {
    var r = CONTENT.rooms;
    var rooms = r.items.map(function(room){
      var tags = (room.tags||[]).map(function(t){ return '<span class="room-tag">'+esc(t)+'</span>'; }).join('');
      return '<div class="room-item reveal">'+
        '<div class="room-media">'+ph(room.imageLabel)+'</div>'+
        '<div class="room-body">'+
          '<div class="room-name">'+esc(room.name)+'</div>'+
          '<p class="room-desc">'+esc(room.desc)+'</p>'+
          '<div class="room-meta">'+tags+'<span class="room-tag">'+esc(room.capacity)+'</span></div>'+
          '<div class="room-price">'+esc(room.price)+' <small>'+esc(room.priceNote)+'</small></div>'+
        '</div>'+
      '</div>';
    }).join('');
    out.push(
      '<section id="rooms">'+
        '<div class="wrap">'+
          '<div class="section-head reveal">'+
            '<div class="eyebrow">'+esc(r.eyebrow)+'</div>'+
            '<h2 class="section-title">'+esc(r.title)+'</h2>'+
          '</div>'+
          '<div class="room-list">'+rooms+'</div>'+
        '</div>'+
      '</section>'
    );
  }

  /* ---------- REVIEW ---------- */
  if (S.review && CONTENT.review && ((CONTENT.review.pros||[]).length || (CONTENT.review.fullText||[]).length)) {
    var rv = CONTENT.review;
    var prosLi = (rv.pros||[]).map(function(t){ return '<li>'+esc(t)+'</li>'; }).join('');
    var consLi = (rv.cons||[]).map(function(t){ return '<li>'+esc(t)+'</li>'; }).join('');
    var fullBlocks = (rv.fullText||[]).map(function(b, idx){
      var num = String(idx + 1).padStart ? String(idx + 1).padStart(2, '0') : ('0' + (idx + 1)).slice(-2);
      var variantClass = b.variant === 'note' ? ' is-note' : (b.variant === 'quote' ? ' is-quote' : '');
      var lead = b.lead ? '<p class="review-lead">'+esc(b.lead)+'</p>' : '';
      var paras = (b.paragraphs||[]).map(function(p){ return '<p>'+esc(p)+'</p>'; }).join('');
      return '<article class="review-article'+variantClass+'">'+
        '<div class="review-article-num">'+num+'</div>'+
        '<div class="review-article-body">'+
          '<h4>'+esc(b.h)+'</h4>'+
          '<div class="review-article-rule"></div>'+
          lead+
          paras+
        '</div>'+
      '</article>';
    }).join('');
    out.push(
      '<section id="review">'+
        '<div class="wrap">'+
          '<div class="section-head reveal">'+
            '<div class="eyebrow">'+esc(rv.eyebrow)+'</div>'+
            '<h2 class="section-title">'+esc(rv.title)+'</h2>'+
          '</div>'+
          '<div class="reveal">'+
            '<div class="tab-buttons" role="tablist">'+
              '<button class="tab-btn active" data-tabset="review" data-tab="summary">重點整理</button>'+
              '<button class="tab-btn" data-tabset="review" data-tab="full">完整心得</button>'+
            '</div>'+
            '<div class="tab-panel active" data-tabset="review" data-tab="summary">'+
              (prosLi || consLi ? '<div class="pros-cons">'+
                (prosLi ? '<div class="pc-card pros"><h3>喜歡的地方</h3><ul>'+prosLi+'</ul></div>' : '')+
                (consLi ? '<div class="pc-card cons"><h3>入住前留意</h3><ul>'+consLi+'</ul></div>' : '')+
              '</div>' : '')+
              (rv.suited ? '<div class="review-note"><b>適合誰：</b>'+esc(rv.suited)+'</div>' : '')+
              (rv.surprise ? '<div class="review-note"><b>小驚喜：</b>'+esc(rv.surprise)+'</div>' : '')+
            '</div>'+
            '<div class="tab-panel review-full" data-tabset="review" data-tab="full">'+fullBlocks+'</div>'+
          '</div>'+
        '</div>'+
      '</section>'
    );
  }


  /* ---------- GALLERY ---------- */
  if (S.gallery && CONTENT.gallery && (CONTENT.gallery.images||[]).length) {
    var g = CONTENT.gallery;
    var imgs = g.images.map(function(im){ return ph(im.label, ''); }).join('');
    out.push(
      '<section id="gallery">'+
        '<div class="wrap">'+
          '<div class="section-head reveal">'+
            '<div class="eyebrow">'+esc(g.eyebrow)+'</div>'+
            '<h2 class="section-title">'+esc(g.title)+'</h2>'+
          '</div>'+
          '<div class="gallery-grid reveal">'+imgs+'</div>'+
        '</div>'+
      '</section>'
    );
  }

  /* ---------- STAY INFO ---------- */
  if (S.stayInfo && CONTENT.stayInfo && (CONTENT.stayInfo.facts||[]).length) {
    var si = CONTENT.stayInfo;
    var rows = si.facts.map(function(fc){
      var longCls = (fc.v && fc.v.length > 20) ? ' info-row--long' : '';
      return '<div class="info-row'+longCls+'"><span class="k">'+esc(fc.k)+'</span><span class="v">'+esc(fc.v)+'</span></div>';
    }).join('');
    out.push(
      '<section id="stay-info">'+
        '<div class="wrap">'+
          '<div class="section-head reveal">'+
            '<div class="eyebrow">'+esc(si.eyebrow)+'</div>'+
            '<h2 class="section-title">'+esc(si.title)+'</h2>'+
          '</div>'+
          '<div class="info-list reveal">'+rows+'</div>'+
          (si.note ? '<p class="info-note">'+esc(si.note)+'</p>' : '')+
        '</div>'+
      '</section>'
    );
  }

  /* ---------- LOCATION ---------- */
  if (S.location && CONTENT.location) {
    var loc = CONTENT.location;
    var addressRow = loc.address
      ? '<div class="transport-item"><div class="transport-mode">'+esc(loc.addressLabel || '地址')+'</div><div class="transport-desc">'+esc(loc.address)+'</div></div>'
      : '';
    var trans = addressRow + (loc.transport||[]).map(function(t){
      return '<div class="transport-item"><div class="transport-mode">'+esc(t.mode)+'</div><div class="transport-desc">'+esc(t.desc)+'</div></div>';
    }).join('');
    var mapInner = '<div class="location-card-title">'+esc(loc.districtLabel || '')+'</div>'+
      '<div class="location-card-sub">'+esc(loc.mapLabel)+'</div>'+
      '<span class="btn on-dark">開啟導航 <span class="arrow">→</span></span>';
    var mapBlock = loc.mapUrl
      ? '<a class="location-card ripple-btn" href="'+loc.mapUrl+'" target="_blank" rel="noopener noreferrer" aria-label="開啟導航前往'+esc(CONTENT.meta.siteName)+'">'+mapInner+'</a>'
      : '<div class="location-card">'+mapInner+'</div>';
    out.push(
      '<section id="location">'+
        '<div class="wrap">'+
          '<div class="section-head reveal">'+
            '<div class="eyebrow">'+esc(loc.eyebrow)+'</div>'+
            '<h2 class="section-title">'+esc(loc.title)+'</h2>'+
          '</div>'+
          '<div class="location-grid">'+
            '<div class="reveal">'+mapBlock+'</div>'+
            '<div class="reveal">'+
              '<div class="transport-list">'+trans+'</div>'+
            '</div>'+
          '</div>'+
        '</div>'+
      '</section>'
    );
  }

  /* ---------- ITINERARY ---------- */
  if (S.itinerary && CONTENT.itinerary && (CONTENT.itinerary.days||[]).length) {
    var it = CONTENT.itinerary;

    function stopTitleSizeClass(text){
      var len = (text||'').length;
      if (len >= 14) return 'title-xlong';
      if (len >= 9) return 'title-long';
      return 'title-normal';
    }
    function renderStopTitle(s){
      var parts = s.titleParts;
      var fullText = (parts && parts.length) ? parts.join('') : (s.name || '');
      var sizeCls = stopTitleSizeClass(fullText);
      var inner;
      if (parts && parts.length) {
        inner = parts.map(function(p, i){
          return '<span class="title-phrase">'+esc(p)+'</span>' + (i < parts.length - 1 ? '<wbr><br class="title-break">' : '');
        }).join('');
      } else {
        inner = esc(s.name);
      }
      return '<div class="stop-name '+sizeCls+'">'+inner+'</div>';
    }

    var dayButtons = it.days.map(function(d, idx){
      return '<button class="tab-btn'+(idx===0?' active':'')+'" data-tabset="itinerary" data-tab="day'+idx+'">'+esc(d.label)+'</button>';
    }).join('');
    var dayPanels = it.days.map(function(d, idx){
      var stops = (d.stops||[]).map(function(s){
        var metaRows = [];
        if (s.rating) metaRows.push('<div class="stop-meta-row"><span class="mk">評分</span><span class="mv">'+esc(s.rating)+'</span></div>');
        if (s.hours) metaRows.push('<div class="stop-meta-row"><span class="mk">營業時間</span><span class="mv">'+esc(s.hours)+'</span></div>');
        if (s.closed) metaRows.push('<div class="stop-meta-row"><span class="mk">公休日</span><span class="mv">'+esc(s.closed)+'</span></div>');
        if (s.address) metaRows.push('<div class="stop-meta-row"><span class="mk">地址</span><span class="mv">'+esc(s.address)+'</span></div>');
        var meta = metaRows.join('');
        return '<div class="stop">'+
          '<div class="stop-time">'+esc(s.time)+'</div>'+
          '<div>'+
            renderStopTitle(s)+
            (meta ? '<div class="stop-meta">'+meta+'</div>' : '')+
            (s.note ? '<div class="stop-note">'+esc(s.note)+'</div>' : '')+
            (s.mapHref ? '<div class="place-actions"><a class="stop-link ripple-btn" href="'+s.mapHref+'" target="_blank" rel="noopener noreferrer">開啟導航 <span class="arrow">→</span></a></div>' : '')+
          '</div>'+
        '</div>';
      }).join('');
      return '<div class="tab-panel'+(idx===0?' active':'')+'" data-tabset="itinerary" data-tab="day'+idx+'">'+
        (d.subtitle ? '<div class="day-subtitle">'+esc(d.subtitle)+'</div>' : '')+
        stops+
      '</div>';
    }).join('');
    out.push(
      '<section id="itinerary">'+
        '<div class="wrap">'+
          '<div class="section-head reveal">'+
            '<div class="eyebrow">'+esc(it.eyebrow)+'</div>'+
            '<h2 class="section-title">'+esc(it.title)+'</h2>'+
          '</div>'+
          '<div class="reveal">'+
            '<div class="tab-buttons" role="tablist">'+dayButtons+'</div>'+
            dayPanels+
            (it.closingNote ? '<p class="itinerary-note">'+esc(it.closingNote)+'</p>' : '')+
          '</div>'+
        '</div>'+
      '</section>'
    );
  }

  /* ---------- FAQ ---------- */
  if (S.faq && CONTENT.faq && (CONTENT.faq.items||[]).length) {
    var fq = CONTENT.faq;
    var faqItems = fq.items.map(function(it, idx){
      return '<details class="faq-item"'+(idx===0?' open':'')+'>'+
        '<summary>'+esc(it.q)+'<span class="plus">+</span></summary>'+
        '<div class="faq-answer">'+esc(it.a)+'</div>'+
      '</details>';
    }).join('');
    out.push(
      '<section id="faq">'+
        '<div class="wrap">'+
          '<div class="section-head reveal">'+
            '<div class="eyebrow">'+esc(fq.eyebrow)+'</div>'+
            '<h2 class="section-title">'+esc(fq.title)+'</h2>'+
          '</div>'+
          '<div class="faq-list reveal">'+faqItems+'</div>'+
        '</div>'+
      '</section>'
    );
  }

  /* ---------- BOOKING CTA ---------- */
  if (S.booking && CONTENT.booking) {
    var b = CONTENT.booking;
    var bookingTitle = '<span class="title-phrase">'+esc(b.titleLine1)+'</span>'+
      '<wbr><br class="title-break">'+
      '<span class="title-phrase">'+esc(b.titleLine2)+'</span>';
    out.push(
      '<section class="booking" id="booking">'+
        '<div class="wrap reveal">'+
          '<div class="eyebrow">'+esc(b.eyebrow)+'</div>'+
          '<h2>'+bookingTitle+'</h2>'+
          '<p>'+esc(b.subtitle)+'</p>'+
          '<a class="btn on-dark" href="'+b.ctaHref+'" target="_blank" rel="noopener noreferrer">'+esc(b.ctaLabel)+'</a>'+
        '</div>'+
      '</section>'
    );
  }

  /* ---------- FOOTER ---------- */
  if (S.footer && CONTENT.footer) {
    var ft = CONTENT.footer;
    var flinks = (ft.links||[]).map(function(l){ return '<a href="'+l.href+'">'+esc(l.label)+'</a>'; }).join('');
    var fsocial = (ft.social||[]).map(function(s){ return '<a class="ig-btn" href="'+s.href+'" target="_blank" rel="noopener noreferrer">'+esc(s.label)+'</a>'; }).join('');
    var fdisclaimer = (ft.disclaimerParagraphs||[]).map(function(p){ return '<p class="footer-disclaimer">'+esc(p)+'</p>'; }).join('');
    out.push(
      '<footer class="site-footer">'+
        '<div class="wrap">'+
          '<div class="footer-top">'+
            '<div class="footer-logo">'+esc(ft.logoText)+'</div>'+
            (flinks ? '<div class="footer-links">'+flinks+'</div>' : '')+
            (fsocial ? '<div class="footer-social">'+fsocial+'</div>' : '')+
          '</div>'+
          fdisclaimer+
        '</div>'+
      '</footer>'
    );
  }

  document.getElementById('app').innerHTML = out.join('');

  /* ---------- interactions ---------- */

  // prune nav links whose target section isn't actually in the DOM
  // (covers both a disabled section AND a section skipped due to empty data)
  document.querySelectorAll('.nav-links a[href^="#"], .nav-mobile a[href^="#"]').forEach(function(a){
    var id = a.getAttribute('href').slice(1);
    if (id && !document.getElementById(id)) { a.remove(); }
  });

  // ripple click effect (event-delegated for any .ripple-btn)
  document.addEventListener('click', function(e){
    var btn = e.target.closest('.ripple-btn');
    if (!btn) return;
    var rect = btn.getBoundingClientRect();
    var size = Math.max(rect.width, rect.height);
    var span = document.createElement('span');
    span.className = 'ripple';
    span.style.width = span.style.height = size + 'px';
    span.style.left = (e.clientX - rect.left - size / 2) + 'px';
    span.style.top = (e.clientY - rect.top - size / 2) + 'px';
    btn.appendChild(span);
    span.addEventListener('animationend', function(){ span.remove(); });
  });

  // generic tabset toggle (drives review + itinerary tab groups)
  document.querySelectorAll('.tab-btn[data-tabset]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var group = btn.getAttribute('data-tabset');
      var tab = btn.getAttribute('data-tab');
      document.querySelectorAll('.tab-btn[data-tabset="'+group+'"]').forEach(function(b){ b.classList.remove('active'); });
      document.querySelectorAll('.tab-panel[data-tabset="'+group+'"]').forEach(function(p){ p.classList.remove('active'); });
      btn.classList.add('active');
      var panel = document.querySelector('.tab-panel[data-tabset="'+group+'"][data-tab="'+tab+'"]');
      if (panel) panel.classList.add('active');
    });
  });

  // mobile nav toggle
  var navToggle = document.getElementById('navToggle');
  var navMobile = document.getElementById('navMobile');
  if (navToggle && navMobile) {
    navToggle.addEventListener('click', function(){
      var open = navMobile.classList.toggle('open');
      navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    navMobile.querySelectorAll('a').forEach(function(a){
      a.addEventListener('click', function(){
        navMobile.classList.remove('open');
        navToggle.setAttribute('aria-expanded','false');
      });
    });
  }

  // scroll reveal
  var revealEls = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window && revealEls.length) {
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if (entry.isIntersecting) {
          entry.target.classList.add('in-view');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
    revealEls.forEach(function(el){ io.observe(el); });
  } else {
    revealEls.forEach(function(el){ el.classList.add('in-view'); });
  }

  // dot rail — built from enabled sections that exist in the DOM
  var railTargets = [];
  (CONTENT.nav && CONTENT.nav.links || []).forEach(function(l){
    var id = l.href.replace('#','');
    if (document.getElementById(id)) railTargets.push({ id: id, label: l.label });
  });
  if (railTargets.length) {
    var rail = document.createElement('div');
    rail.className = 'dot-rail';
    rail.setAttribute('aria-hidden','true');
    rail.innerHTML = railTargets.map(function(t){
      return '<a href="#'+t.id+'" data-target="'+t.id+'" title="'+t.label+'"></a>';
    }).join('');
    document.body.appendChild(rail);

    var dots = rail.querySelectorAll('a');
    var sectionsEls = railTargets.map(function(t){ return document.getElementById(t.id); });
    if ('IntersectionObserver' in window) {
      var railIo = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          if (entry.isIntersecting) {
            dots.forEach(function(d){ d.classList.remove('active'); });
            var match = rail.querySelector('[data-target="'+entry.target.id+'"]');
            if (match) match.classList.add('active');
          }
        });
      }, { threshold: 0.5 });
      sectionsEls.forEach(function(el){ if (el) railIo.observe(el); });
    }
  }

})();
</script>

</body>
</html>
